<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="__GOOGLE_SITE_VERIFICATION__" data-runtime-config />
    <script>window.__PAPERVAULT_GA_ID__ = "__GA_ID__"</script>
    <title>PaperVault</title>
    <script>
      (function () {
        var baiduId = "__BA_ID__";
        // 运行时拼接占位符，避免被 entrypoint.sh 的全局 sed 替换改写守卫字面量
        var placeholder = "_" + "_BA_" + "ID_" + "_";
        if (!baiduId || baiduId === placeholder) return;
        window._hmt = window._hmt || [];
        var hm = document.createElement("script");
        hm.src = "https://hm.baidu.com/hm.js?" + encodeURIComponent(baiduId);
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <style>
        .code-loader {
          color: #999;
          font-family: Consolas, Menlo, Monaco, monospace;
          font-weight: bold;
          font-size: 100px;
          opacity: 0.8;
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
        }

        .code-loader span {
          display: inline-block;
          animation: pulse_414 0.4s alternate infinite ease-in-out;
        }

        .code-loader span:nth-child(odd) {
          animation-delay: 0.4s;
        }

        @keyframes pulse_414 {
          to {
            transform: scale(0.8);
            opacity: 0.5;
          }
        }
      </style>
      <div class="code-loader"><span>{</span><span>}</span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

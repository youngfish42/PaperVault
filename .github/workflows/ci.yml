name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "papervault/**"
      - "tests/**"
      - "web-vue/**"
      - "app.py"
      - "Dockerfile"
      - ".dockerignore"
      - "gunicorn.conf.py"
      - "data_artifacts.py"
      - "collector.py"
      - "requirements.txt"
      - "pytest.ini"
      - "web-vue/package.json"
      - "web-vue/package-lock.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "papervault/**"
      - "tests/**"
      - "web-vue/**"
      - "app.py"
      - "Dockerfile"
      - ".dockerignore"
      - "gunicorn.conf.py"
      - "data_artifacts.py"
      - "collector.py"
      - "requirements.txt"
      - "pytest.ini"
      - "web-vue/package.json"
      - "web-vue/package-lock.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    env:
      PAPERVAULT_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest (offline smoke)
        run: pytest -q

  frontend:
    name: Frontend (type-check + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-vue
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: web-vue/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint:check

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag papervault:ci .

name: Force Rebuild Cache and Update README

env:
  PYTHON_VERSION: "3.10"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "更新模式: readme (仅更新 README, 默认) 或 force (全量重建缓存并更新 README)"
        required: false
        default: "readme"

concurrency:
  # Avoid duplicate README rebuilds without blocking unrelated maintenance
  # workflows; direct pushes rebase and HF uploads use optimistic locking.
  group: papervault-readme
  cancel-in-progress: false

jobs:
  acquire_lock:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      lock_commit: ${{ steps.acquire.outputs.lock_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Acquire HF writer lock
        id: acquire
        run: |
          lock_commit=$(python scripts/maintenance_lock.py acquire)
          echo "lock_commit=$lock_commit" >> "$GITHUB_OUTPUT"

  rebuild:
    needs: acquire_lock
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Shanghai
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PAPERVAULT_HF_REPO_ID: ${{ vars.PAPERVAULT_HF_REPO_ID }}
      # Force the classic HTTPS/LFS download path on the runner; the Xet
      # protocol has been observed to stall on some networks and there is no
      # benefit to it for our single ~250MB cache file.
      HF_HUB_DISABLE_XET: "1"
      # The large cache lives on Hugging Face. Keep the LFS smudge filter
      # disabled in case a historical rule is reintroduced accidentally.
      GIT_LFS_SKIP_SMUDGE: "1"
    permissions:
      contents: write
    steps:
      - name: Checkout (no LFS; cache.jsonl.gz lives on Hugging Face)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chinese fonts
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra fontconfig
          sudo fc-cache -fv

      - name: Verify Chinese fonts
        run: |
          echo "[*] Installed CJK fonts:"
          fc-list :lang=zh -f "%{family}\t%{file}\n"
          echo "[*] Matplotlib cache dir:"
          python -c "import matplotlib; print(matplotlib.get_cachedir())"

      - name: Run rebuild
        run: |
          if [ "${{ github.event.inputs.mode }}" == "force" ]; then
            echo "[*] Force rebuild mode"
            python maintain.py force
          else
            echo "[*] README-only mode"
            python maintain.py
          fi

      - name: Setup GIT user
        run: |
          git config --local user.name "youngfish42"
          git config --local user.email "youngfish42@users.noreply.github.com"

      - name: Generate run summary
        env:
          README_MODE: ${{ github.event.inputs.mode }}
        run: |
          python scripts/generate_run_summary.py readme \
            --mode "${README_MODE:-readme}" \
            --cache cache/cache.jsonl.gz \
            --meta cache/readme_meta.json \
            --output "$RUNNER_TEMP/run_summary.md" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat "$RUNNER_TEMP/run_summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push to main
        # The large cache stays on Hugging Face; only rendered artifacts are
        # eligible for the direct main commit.
        run: |
          python scripts/commit_automated_changes.py \
            --message "chore(auto): force rebuild cache and update README" \
            --paths \
              README.md \
              README.en.md \
              cache/readme_meta.json \
              pics/stats/stats_overview.svg \
              pics/stats/papers_by_category.svg \
              pics/stats/papers_by_year.svg \
              pics/stats/wordcloud.svg \
              docs/stats.html

      - name: Sync Hugging Face dataset README
        # Render docs/HF_README.md with the just-updated cache stats and push
        # it to the HF dataset repo root as README.md. Always-run so the HF
        # landing page is refreshed even when no GitHub-side diff is produced
        # (e.g. README-only mode with no statistical movement).
        if: always()
        run: python scripts/sync_hf_readme.py --skip-cache-refresh

  release_lock:
    needs: [acquire_lock, rebuild]
    if: always() && needs.acquire_lock.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Release HF writer lock
        run: |
          python scripts/maintenance_lock.py release \
            --lock-commit "${{ needs.acquire_lock.outputs.lock_commit }}"

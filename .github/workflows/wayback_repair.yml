name: Wayback URL Repair

# 自动修复 cache 中 web.archive.org 包装的死论文链接（AAAI/UAI 2000-2014
# 等 ~4.4k 条），工具为 scripts/repair_wayback_urls.py。
#
# 定时设计：OpenAlex 匿名日配额按 UTC 日重置，该配额在 runner 共享 IP 段上
# 通常很快耗尽，因此定在 UTC 00:40（北京 08:40）开跑——backfill_abstracts.yml
# 已于 2026-10-24 相位平移到 UTC 01:00/07:00/13:00/19:00（每 6 小时），其
# 19:00 档在最坏情况下 00:30 前结束，本任务独享配额重置后的新鲜窗口，
# 不会再排在 5h 回填任务之后（papervault-cache 并发组串行）。
# 注意：GitHub 的 schedule 只在默认分支（main）上生效——本 workflow 合入
# main 后才会真正每日运行。
#
# 安全设计：修复幂等（已迁移记录不会重复处理，中断/限流后次日重跑安全）；
# 迁移日志 cache/wayback_repair_log.jsonl 随自动 PR 提交（回滚依据）；
# 整体回滚方法见 AGENTS.md "CI/CD Workflows" 的 Wayback repair rollback plan。

on:
  schedule:
    - cron: "40 0 * * *"  # UTC 00:40 = 北京 08:40（OpenAlex 配额 UTC 午夜重置后；19:00 档回填最坏 00:30 已结束）
  workflow_dispatch:      # 允许手动补跑（write 模式；dry-run 请用 backfill_abstracts.yml 的 wayback-repair job）

concurrency:
  # Shared with backfill_abstracts / collect_papers / update_readme to serialise
  # every workflow that mutates cache.jsonl.gz on Hugging Face.
  group: papervault-cache
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.10"
  # 专用分支：不与 backfill_abstracts.yml 的 auto-backfill-abstracts 争用
  #（同一 head 分支只能对应一个打开中的 PR，共用会互相覆盖）。
  WAYBACK_BRANCH: "auto-wayback-repair"

jobs:
  wayback-repair:
    runs-on: ubuntu-latest
    # 配额正常时全量 ~4.4k 条 × ~1.6s ≈ 2h；加上传/PR 余量给 200 分钟硬上限。
    timeout-minutes: 200
    env:
      TZ: Asia/Shanghai
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PAPERVAULT_HF_REPO_ID: ${{ vars.PAPERVAULT_HF_REPO_ID }}
      # cache.jsonl.gz 走 HF；强制经典 HTTPS/LFS 路径（Xet 在部分网络上会停滞）。
      HF_HUB_DISABLE_XET: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout (no LFS; cache.jsonl.gz lives on Hugging Face)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore previous migration log (if any)
        # 迁移日志按 PR 分支持久化（本工作流专用的 auto-wayback-repair 分支，
        # 不与 backfill_abstracts 的 auto-backfill-abstracts 分支争用——同一
        # head 分支只能对应一个打开中的 PR，共用会互相覆盖）。修复脚本以
        # append 方式写日志，恢复后多日的迁移记录可在同一 PR 中累积。
        run: |
          if git ls-remote --exit-code --heads origin "${{ env.WAYBACK_BRANCH }}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${{ env.WAYBACK_BRANCH }}"
            if git cat-file -e "origin/${{ env.WAYBACK_BRANCH }}:cache/wayback_repair_log.jsonl" 2>/dev/null; then
              git checkout "origin/${{ env.WAYBACK_BRANCH }}" -- cache/wayback_repair_log.jsonl
              echo "Restored migration log from ${{ env.WAYBACK_BRANCH }}."
            fi
          else
            echo "No existing ${{ env.WAYBACK_BRANCH }} branch; starting fresh."
          fi

      - name: Repair wayback-wrapped URLs (write mode, in-process verified HF push)
        # 修复脚本在同一进程内完成 HF 上传（_sync_or_die）：启动时
        # ensure_cache_local 登记的 parent_commit 仍然有效（乐观锁保留），
        # 上传结果显式校验、失败非零退出。被限流的记录保持不变，次日定时
        # run 自然重试。
        run: |
          set -o pipefail
          python scripts/repair_wayback_urls.py --write | tee "$RUNNER_TEMP/wayback_repair.log"
          {
            echo "### Wayback repair report (scheduled write run)"
            echo ""
            echo '```'
            tail -n 60 "$RUNNER_TEMP/wayback_repair.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check whether anything was repaired
        # 报告中的 "rewrite (in place)" + "merge (dup (conf,url))" 计数；
        # 全限流的日子（rewrite=0）不开空 PR。
        id: repaired
        run: |
          rewritten=$(grep -oP 'rewrite \(in place\)\s*:\s*\K[0-9]+' "$RUNNER_TEMP/wayback_repair.log" || echo 0)
          merged=$(grep -oP 'merge \(dup \(conf,url\)\)\s*:\s*\K[0-9]+' "$RUNNER_TEMP/wayback_repair.log" || echo 0)
          rewritten=${rewritten:-0}; merged=${merged:-0}
          echo "rewrite=$rewritten merge=$merged"
          if [ "$rewritten" -gt 0 ] || [ "$merged" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[*] No URLs repaired this run (likely OpenAlex daily quota exhausted); will retry on the next scheduled run."
          fi

      - name: Setup GIT user
        if: steps.repaired.outputs.changed == 'true'
        run: |
          git config --local user.name "youngfish42"
          git config --local user.email "youngfish42@users.noreply.github.com"

      - name: Fetch latest main
        if: steps.repaired.outputs.changed == 'true'
        run: git fetch origin main

      - name: Generate PR summary
        if: steps.repaired.outputs.changed == 'true'
        run: |
          python scripts/generate_pr_body.py wayback \
            --log "$RUNNER_TEMP/wayback_repair.log" \
            --output "$RUNNER_TEMP/pr_body.md" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Create Pull Request with migration log
        # 迁移日志（每条 旧→新 URL 映射）是回滚依据，必须随 PR 提交。
        # cache.jsonl.gz / progress 不进 PR（它们在 Hugging Face 上，已由
        # 修复步骤在同一进程内带乐观锁推送并校验）。
        if: steps.repaired.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(auto): repair wayback-wrapped dead paper URLs"
          committer: youngfish42 <youngfish42@users.noreply.github.com>
          author: youngfish42 <youngfish42@users.noreply.github.com>
          title: "[Auto] Repair wayback-wrapped dead paper URLs"
          body-path: ${{ runner.temp }}/pr_body.md
          branch: ${{ env.WAYBACK_BRANCH }}
          delete-branch: false
          add-paths: |
            cache/wayback_repair_log.jsonl

      - name: Upload repair log artifact
        # 无论是否有改写都留 artifact，便于核查限流日与成功日。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayback-repair-log-${{ github.run_number }}
          path: cache/wayback_repair_log.jsonl
          if-no-files-found: ignore
          retention-days: 30

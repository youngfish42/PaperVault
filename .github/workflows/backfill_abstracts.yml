name: Backfill Abstracts

env:
  PYTHON_VERSION: "3.10"
  AUTO_BACKFILL_BRANCH: "auto-backfill-abstracts"
  # cache/cache.jsonl.gz AND cache/abstract_backfill_progress.jsonl.gz are
  # intentionally excluded from the auto-PR: both live on Hugging Face
  # (PAPERVAULT_HF_REPO_ID) and are pushed via data_artifacts.sync_cache_artifacts.
  AUTO_BACKFILL_FILES: "docs/abstract_backfill_progress.md pics/stats/stats_overview.svg"

on:
  schedule:
    # 每 6 小时运行一次 (UTC 01:00 / 07:00 / 13:00 / 19:00)，运行时长由 --soft-timeout 控制（约5小时后自动保存进度退出）。
    # 2026-10-24 相位平移：从 00:00/06:00/12:00/18:00 后移 1 小时——19:00 档
    # 最坏在 00:30 前结束（330min 硬上限），给 wayback_repair.yml（UTC 00:40
    # 开跑）让出 OpenAlex 日配额刚重置后的新鲜窗口；两个工作流共享
    # papervault-cache 并发组串行。
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      target_conf:
        description: "手动指定 conf（如 AAAI2020），留空则自动处理最高优先级论文，直到时间耗尽"
        required: false
        default: ""
      force:
        description: "强制获取摘要：即使论文之前获取摘要失败也继续尝试（默认关闭；不会覆盖已有摘要）"
        required: false
        default: false
        type: boolean
      run_wayback_repair:
        description: "运行 wayback 死链修复 job（repair_wayback_urls.py），代替常规 backfill"
        required: false
        default: false
        type: boolean
      wayback_repair_dry_run:
        description: "wayback 修复只跑 dry-run 报告（默认 true；改为 false 才真正改写缓存并开 PR）"
        required: false
        default: true
        type: boolean

concurrency:
  # Shared with collect_papers / update_readme to serialise every workflow
  # that mutates cache.jsonl.gz on Hugging Face.
  group: papervault-cache
  cancel-in-progress: false

jobs:
  backfill:
    # 手动触发 wayback 修复时跳过常规 5h backfill pass（只跑修复 job）。
    if: github.event_name == 'schedule' || !inputs.run_wayback_repair
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Shanghai
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PAPERVAULT_HF_REPO_ID: ${{ vars.PAPERVAULT_HF_REPO_ID }}
      # Force the classic HTTPS/LFS download path on the runner; the Xet
      # protocol has been observed to stall on some networks and there is no
      # benefit to it for our single ~250MB cache file.
      HF_HUB_DISABLE_XET: "1"
      # cache/cache.jsonl.gz and cache/abstract_backfill_progress.jsonl.gz
      # are no longer maintained via Git LFS (they live on Hugging Face).
      # GIT_LFS_SKIP_SMUDGE remains set as a safety belt: if a residual LFS
      # rule sneaks back in, the smudge filter would otherwise consume our
      # exhausted LFS bandwidth budget.
      GIT_LFS_SKIP_SMUDGE: "1"
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout (no LFS; cache.jsonl.gz lives on Hugging Face)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore in-progress auto backfill state
        run: |
          write_hashes() {
            local output_file="$1"
            : > "$output_file"
            for file in ${{ env.AUTO_BACKFILL_FILES }}; do
              if [ -f "$file" ]; then
                sha256sum "$file" >> "$output_file"
              else
                printf 'missing  %s\n' "$file" >> "$output_file"
              fi
            done
          }

          if git ls-remote --exit-code --heads origin "${{ env.AUTO_BACKFILL_BRANCH }}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${{ env.AUTO_BACKFILL_BRANCH }}"
            for file in ${{ env.AUTO_BACKFILL_FILES }}; do
              if git cat-file -e "origin/${{ env.AUTO_BACKFILL_BRANCH }}:$file" 2>/dev/null; then
                git checkout "origin/${{ env.AUTO_BACKFILL_BRANCH }}" -- "$file"
              else
                echo "Skip missing tracked file from ${{ env.AUTO_BACKFILL_BRANCH }}: $file"
              fi
            done
            echo "Restored latest auto backfill state from ${{ env.AUTO_BACKFILL_BRANCH }}."
          else
            echo "No existing auto backfill branch found; starting from main."
          fi

          write_hashes "$RUNNER_TEMP/backfill_baseline.sha256"

      - name: Snapshot cache.jsonl.gz abstract baseline (from Hugging Face)
        # Pull the authoritative cache from HF and count how many records
        # currently have a non-empty paper_abstract BEFORE the backfill runs.
        # We gate PR creation on this number growing, so a no-op backfill
        # (every targeted paper failed lookup, or all targets were already
        # covered) does not open a bandwidth-wasting PR just because
        # progress JSON timestamps moved.
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip
          import json
          import os

          from data_artifacts import ensure_cache_local, DEFAULT_CACHE_PATH

          cache_path, _ = ensure_cache_local(DEFAULT_CACHE_PATH)
          cache_path = Path(cache_path)

          total = 0
          with_abstract = 0
          if cache_path.exists():
              with gzip.open(cache_path, "rt", encoding="utf-8") as handle:
                  for line in handle:
                      line = line.strip()
                      if not line:
                          continue
                      total += 1
                      try:
                          record = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if (record.get("paper_abstract") or "").strip():
                          with_abstract += 1

          out = Path(os.environ["RUNNER_TEMP"]) / "cache_baseline.count"
          out.write_text(f"{with_abstract} {total}\n", encoding="utf-8")
          print(f"[+] cache baseline abstracts={with_abstract}/{total}")
          PY

      - name: Run abstract backfill
        run: |
          force_flag=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            force_flag="--force"
          fi
          if [ -n "${{ github.event.inputs.target_conf }}" ]; then
            python scripts/fetch_abstracts.py --conf "${{ github.event.inputs.target_conf }}" --chunk-size 500 --soft-timeout 14400 --max-failed-attempts 3 $force_flag
          else
            python scripts/fetch_abstracts.py --batch --chunk-size 500 --soft-timeout 14400 --max-failed-attempts 3 $force_flag
          fi

      - name: Retry recoverable failures (--reason-in whitelist)
        # After the main pass we spend up to one extra hour retrying only
        # the failure reasons that *can* actually recover on a re-attempt
        # (transient upstream state). Structural failures such as
        # ``no_doi`` / ``doi_not_found`` / ``venue_index`` /
        # ``delegated_to_specialised_fetcher`` are permanently skipped by
        # this whitelist so the retry budget is not wasted on them.
        #
        # ``--no-include-legacy`` (fourth review pass, issue #5): the
        # default ``--include-legacy`` semantics let every v3 record
        # (which has no ``reason`` field) into the retry set — that
        # completely defeats the whitelist for our current progress
        # ledger (which is still mostly v3). Forcing the strict form
        # here means only records that we *know* failed with a
        # recoverable reason (v4 records with an in-whitelist ``reason``
        # field) are retried, matching the workflow's stated intent.
        #
        # ``timeout-minutes: 70`` is a hard step-level cap that matches
        # ``--soft-timeout 3600`` (60 min) plus 10 min slack for the
        # graceful save / HF upload. See review issue #10 for the
        # rationale (defence-in-depth against a wedged HTTP client).
        #
        # ``--max-papers 10000`` caps each scheduled retry pass so the workflow
        # does not spend the whole 60 min retry budget chewing through a large
        # backlog of transient failures. The backlog is drained gradually
        # across multiple runs while keeping the total runtime close to the
        # pre-merge ~10 min baseline. When the run is manually triggered with
        # ``force=true`` the cap is removed so an operator can still perform a
        # full unbounded retry.
        #
        # See spec AC-7 / Task 7 and Task 11 for the design rationale.
        if: success() || failure()
        timeout-minutes: 70
        run: |
          force_flag=""
          max_papers_flag="--max-papers 10000"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            force_flag="--force"
            max_papers_flag=""
          fi
          if [ -n "${{ github.event.inputs.target_conf }}" ]; then
            python scripts/fetch_abstracts.py --conf "${{ github.event.inputs.target_conf }}" --chunk-size 500 --soft-timeout 3600 --max-failed-attempts 3 --retry-failed --reason-in "rate_limited,timeout,network,empty_abstract" --no-include-legacy $max_papers_flag $force_flag
          else
            python scripts/fetch_abstracts.py --batch --chunk-size 500 --soft-timeout 3600 --max-failed-attempts 3 --retry-failed --reason-in "rate_limited,timeout,network,empty_abstract" --no-include-legacy $max_papers_flag $force_flag
          fi

      - name: Backfill CVF Open Access abstracts
        # DOI-less venues (CVPR / ICCV / WACV) fall outside the
        # Crossref → Semantic Scholar → arXiv → OpenAlex cascade run above.
        # This step scrapes the openaccess.thecvf.com detail pages directly
        # to fill their <div id="abstract"> content. Runs strictly after the
        # generic backfill so both writers to cache.jsonl.gz are serialised
        # within the same job. `--soft-timeout 2400` (40 min) keeps the total
        # workflow well under the 330 min hard cap.
        run: |
          force_flag=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            force_flag="--force"
          fi
          if [ -n "${{ github.event.inputs.target_conf }}" ]; then
            read -r -a confs <<< "${{ github.event.inputs.target_conf }}"
            python scripts/fetch_cvf_abstracts.py --conf "${confs[@]}" --soft-timeout 2400 $force_flag
          else
            python scripts/fetch_cvf_abstracts.py --soft-timeout 2400 $force_flag
          fi

      - name: Scan GitHub code links from newly backfilled abstracts
        # Pure regex pass over all abstracts; cheap I/O-bound step that keeps the
        # `paper_code` field in sync whenever new abstracts are introduced.
        run: python scripts/fetch_code_links.py --year all --retry-failed

      - name: Regenerate stats overview chart
        run: |
          mkdir -p pics/stats

          python - <<'PY'
          from maintain import cache_path, load_cache, compute_stats, generate_overview_svg
          import os

          if not os.path.exists(cache_path):
              raise SystemExit(f"Cache file not found: {cache_path}")

          cache_data = load_cache(cache_path)
          stats = compute_stats(cache_data)
          generate_overview_svg(stats)
          print("Regenerated stats_overview.svg from latest cache.")
          PY

      - name: Check for changes
        id: check_changes
        # Two gates must both hold for a PR to be opened:
        #   1. The number of records carrying a non-empty paper_abstract grew
        #      (i.e. the backfill actually merged in at least one new abstract),
        #   2. At least one tracked progress/stats file changed.
        # Gate (1) prevents the bandwidth-wasting "ghost PR" pattern where
        # only timestamps inside the progress ledger moved
        # while no new abstract content was added to the authoritative
        # cache.jsonl.gz on Hugging Face.
        run: |
          : > "$RUNNER_TEMP/backfill_current.sha256"
          for file in ${{ env.AUTO_BACKFILL_FILES }}; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> "$RUNNER_TEMP/backfill_current.sha256"
            else
              printf 'missing  %s\n' "$file" >> "$RUNNER_TEMP/backfill_current.sha256"
            fi
          done

          progress_changed=false
          if ! cmp --silent "$RUNNER_TEMP/backfill_baseline.sha256" "$RUNNER_TEMP/backfill_current.sha256"; then
            progress_changed=true
          fi

          python - <<'PY'
          from pathlib import Path
          import gzip
          import json
          import os

          cache_path = Path("cache/cache.jsonl.gz")
          total = 0
          with_abstract = 0
          if cache_path.exists():
              with gzip.open(cache_path, "rt", encoding="utf-8") as handle:
                  for line in handle:
                      line = line.strip()
                      if not line:
                          continue
                      total += 1
                      try:
                          record = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if (record.get("paper_abstract") or "").strip():
                          with_abstract += 1

          out = Path(os.environ["RUNNER_TEMP"]) / "cache_current.count"
          out.write_text(f"{with_abstract} {total}\n", encoding="utf-8")
          print(f"[+] cache current abstracts={with_abstract}/{total}")
          PY

          baseline_abs=$(awk '{print $1}' "$RUNNER_TEMP/cache_baseline.count")
          current_abs=$(awk '{print $1}' "$RUNNER_TEMP/cache_current.count")
          # Defensive defaults: if either snapshot file was unreadable
          # (HF outage, disk full, etc.) treat the count as 0 so the
          # bash arithmetic test below cannot blow up with "unary
          # operator expected" and abort the workflow before we have a
          # chance to print a useful skip message.
          baseline_abs=${baseline_abs:-0}
          current_abs=${current_abs:-0}
          echo "baseline_abstracts=$baseline_abs current_abstracts=$current_abs"

          cache_changed=false
          if [ "$current_abs" -gt "$baseline_abs" ]; then
            cache_changed=true
          fi

          # Manual workflow_dispatch bypass (symmetric with collect_papers.yml).
          # When an operator triggers the workflow by hand -- especially with a
          # specific --conf target -- they usually want the resulting progress
          # bookkeeping (failed_attempts increments, abstract_backfill_progress.md,
          # regenerated stats SVG) to be pushed even if zero new abstracts were
          # actually merged in (e.g. every targeted paper failed lookup on all
          # four sources). Without this bypass those manual runs would never
          # produce a PR and the bookkeeping would be lost on the next cron.
          force_mode=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            force_mode=true
          fi

          echo "progress_changed=$progress_changed cache_changed=$cache_changed force_mode=$force_mode"

          if [ "$progress_changed" = "true" ] && { [ "$cache_changed" = "true" ] || [ "$force_mode" = "true" ]; }; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [ "$cache_changed" != "true" ] && [ "$force_mode" != "true" ]; then
              echo "[*] cache.jsonl.gz gained no new abstracts; skipping PR creation to save bandwidth."
            fi
          fi

      - name: Setup GIT user
        run: |
          git config --local user.name "youngfish42"
          git config --local user.email "youngfish42@users.noreply.github.com"

      - name: Fetch latest main
        run: git fetch origin main

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(auto): backfill abstracts"
          committer: youngfish42 <youngfish42@users.noreply.github.com>
          author: youngfish42 <youngfish42@users.noreply.github.com>
          title: "[Auto] Backfill paper abstracts"
          body: |
            This PR was automatically generated by the `backfill_abstracts` workflow.

            It backfills abstracts for pending papers across conferences/journals,
            continuing from the latest in-progress auto-backfill branch state.
            The `pics/stats/stats_overview.svg` chart is regenerated from the
            updated cache so the README statistics overview stays in sync.
            Please review the changes before merging.

            ---
            *Maintained by [@youngfish42](https://github.com/youngfish42).*
            *For questions, please contact: im.young@foxmail.com*
          branch: ${{ env.AUTO_BACKFILL_BRANCH }}
          delete-branch: false
          add-paths: |
            docs/abstract_backfill_progress.md
            pics/stats/stats_overview.svg

      - name: Sync Hugging Face dataset README
        # Render docs/HF_README.md with the just-updated cache stats and push
        # it to the HF dataset repo root as README.md. Runs unconditionally so
        # the HF landing page reflects the latest abstract coverage even when
        # no PR is opened back to GitHub.
        if: always()
        run: python scripts/sync_hf_readme.py --skip-cache-refresh

  wayback-repair:
    # 手动触发专用 job：修复 web.archive.org 包装的死论文链接
    # （scripts/repair_wayback_urls.py，AAAI/UAI 2000-2014 等 ~4.4k 条）。
    # 本 workflow 的 concurrency group `papervault-cache` 是 workflow-run 级
    # 的，因此该 job 天然与其它 cache-mutating workflow 串行，无需额外配置。
    #
    # 回滚预案见 AGENTS.md "CI/CD Workflows" 小节（HF dataset 是普通 git
    # 仓库，revert/reset 对应 commit 即可；cache/wayback_repair_log.jsonl
    # 记录每条 旧→新 URL 映射，可据此精确反向恢复；修复幂等，重跑安全）。
    if: github.event_name == 'workflow_dispatch' && inputs.run_wayback_repair
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PAPERVAULT_HF_REPO_ID: ${{ vars.PAPERVAULT_HF_REPO_ID }}
      HF_HUB_DISABLE_XET: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout (no LFS; cache.jsonl.gz lives on Hugging Face)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wayback repair (dry-run report only, no data changes)
        # 默认路径：只出报告，不改任何数据、不推 HF。报告同时进 step
        # summary 和 build log。
        if: inputs.wayback_repair_dry_run
        run: |
          python scripts/repair_wayback_urls.py --dry-run | tee "$RUNNER_TEMP/wayback_report.txt"
          {
            echo "### Wayback repair dry-run report"
            echo ""
            echo '```'
            tail -n 80 "$RUNNER_TEMP/wayback_report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore previous migration log (if any)
        # 迁移日志按专用分支 auto-wayback-repair 持久化（不与本 workflow 的
        # auto-backfill-abstracts 分支争用——同一 head 分支只能对应一个打开中
        # 的 PR，共用会互相覆盖）。修复脚本以 append 方式写日志。
        if: ${{ !inputs.wayback_repair_dry_run }}
        run: |
          if git ls-remote --exit-code --heads origin "auto-wayback-repair" >/dev/null 2>&1; then
            git fetch --no-tags origin "auto-wayback-repair"
            if git cat-file -e "origin/auto-wayback-repair:cache/wayback_repair_log.jsonl" 2>/dev/null; then
              git checkout "origin/auto-wayback-repair" -- cache/wayback_repair_log.jsonl
              echo "Restored migration log from auto-wayback-repair."
            fi
          fi

      - name: Wayback repair (--write, in-process verified HF push)
        # 修复脚本在同一进程内完成 HF 上传（_sync_or_die）：启动时
        # ensure_cache_local 登记的 parent_commit 仍然有效（乐观锁保留），
        # 上传结果显式校验、失败非零退出。
        if: ${{ !inputs.wayback_repair_dry_run }}
        run: python scripts/repair_wayback_urls.py --write

      - name: Setup GIT user
        if: ${{ !inputs.wayback_repair_dry_run }}
        run: |
          git config --local user.name "youngfish42"
          git config --local user.email "youngfish42@users.noreply.github.com"

      - name: Fetch latest main
        if: ${{ !inputs.wayback_repair_dry_run }}
        run: git fetch origin main

      - name: Create Pull Request with migration log
        # 迁移日志 cache/wayback_repair_log.jsonl（每条 旧→新 URL 映射）是
        # 回滚的依据，必须随 PR 提交。cache.jsonl.gz / progress 照旧不进 PR
        # （它们在 Hugging Face 上，已由修复步骤在同一进程内带乐观锁推送
        # 并校验，见文件头注释）。
        if: ${{ !inputs.wayback_repair_dry_run }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(auto): repair wayback-wrapped dead paper URLs"
          committer: youngfish42 <youngfish42@users.noreply.github.com>
          author: youngfish42 <youngfish42@users.noreply.github.com>
          title: "[Auto] Repair wayback-wrapped dead paper URLs"
          body: |
            This PR was automatically generated by the `backfill_abstracts`
            workflow (`wayback-repair` job, manual dispatch).

            It repairs `web.archive.org`-wrapped dead `paper_url`s via OpenAlex
            title lookup (see `scripts/repair_wayback_urls.py`). The attached
            `cache/wayback_repair_log.jsonl` records every old→new URL mapping
            and is the basis for rollback (see AGENTS.md "CI/CD Workflows").

            The cache itself (`cache/cache.jsonl.gz`) was already pushed to
            Hugging Face by the repair step (in-process, with the
            parent_commit optimistic lock and a verified upload result).

            ---
            *Maintained by [@youngfish42](https://github.com/youngfish42).*
          branch: "auto-wayback-repair"
          delete-branch: false
          add-paths: |
            cache/wayback_repair_log.jsonl

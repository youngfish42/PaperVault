name: Force Rebuild Cache and Update README

env:
  PYTHON_VERSION: "3.10"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "更新模式: readme (仅更新 README, 默认) 或 force (全量重建缓存并更新 README)"
        required: false
        default: "readme"

concurrency:
  # Shared with collect_papers / backfill_abstracts to serialise every
  # workflow that mutates cache.jsonl.gz on Hugging Face. Even readme-only
  # runs read the cache, so we keep them on the same queue to avoid PR
  # races on README.md / pics/stats/.
  group: papervault-cache
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Shanghai
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PAPERVAULT_HF_REPO_ID: ${{ vars.PAPERVAULT_HF_REPO_ID }}
      # Force the classic HTTPS/LFS download path on the runner; the Xet
      # protocol has been observed to stall on some networks and there is no
      # benefit to it for our single ~250MB cache file.
      HF_HUB_DISABLE_XET: "1"
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout (no LFS; cache.jsonl.gz lives on Hugging Face)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chinese fonts
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra fontconfig
          sudo fc-cache -fv

      - name: Verify Chinese fonts
        run: |
          echo "[*] Installed CJK fonts:"
          fc-list :lang=zh -f "%{family}\t%{file}\n"
          echo "[*] Matplotlib cache dir:"
          python -c "import matplotlib; print(matplotlib.get_cachedir())"

      - name: Run rebuild
        run: |
          if [ "${{ github.event.inputs.mode }}" == "force" ]; then
            echo "[*] Force rebuild mode"
            python maintain.py force
          else
            echo "[*] README-only mode"
            python maintain.py
          fi

      - name: Setup GIT user
        run: |
          git config --local user.name "youngfish42"
          git config --local user.email "youngfish42@users.noreply.github.com"

      - name: Fetch latest main
        run: git fetch origin main

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(auto): force rebuild cache and update README"
          committer: youngfish42 <youngfish42@users.noreply.github.com>
          author: youngfish42 <youngfish42@users.noreply.github.com>
          title: "[Auto] Force rebuild cache and update README"
          body: |
            This PR was automatically generated by the `update_readme` workflow.

            It performs a full cache rebuild from all sources and updates the README conference list.
            Please review the changes before merging.

            ---
            *Maintained by [@youngfish42](https://github.com/youngfish42).*
            *For questions, please contact: im.young@foxmail.com*
          branch: auto-rebuild-cache
          delete-branch: true
          # Defensive whitelist: never let cache/cache.jsonl.gz sneak into the PR.
          # The authoritative copy lives on Hugging Face (PAPERVAULT_HF_REPO_ID)
          # and is uploaded by data_artifacts.sync_cache_artifacts; only the
          # rendered README + stats artefacts should be committed back to git.
          add-paths: |
            README.md
            README.en.md
            cache/readme_meta.json
            pics/stats/stats_overview.svg
            pics/stats/papers_by_category.svg
            pics/stats/papers_by_year.svg
            pics/stats/wordcloud.svg
            docs/stats.html

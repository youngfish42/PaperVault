name: Wayback URL Repair

# 自动修复 cache 中 web.archive.org 包装的死论文链接（AAAI/UAI 2000-2014
# 等 ~4.4k 条），工具为 scripts/repair_wayback_urls.py。
#
# 定时设计：OpenAlex 匿名日配额按 UTC 日重置，该配额在 runner 共享 IP 段上
# 通常很快耗尽，因此定在 UTC 00:43（北京 08:43，重置后第一时间）开跑。
# 注意：GitHub 的 schedule 只在默认分支（main）上生效——本 workflow 合入
# main 后才会真正每日运行。
#
# 安全设计：修复幂等（已迁移记录不会重复处理，中断/限流后次日重跑安全）；
# 迁移日志 cache/wayback_repair_log.jsonl 随自动 PR 提交（回滚依据）；
# 整体回滚方法见 AGENTS.md "CI/CD Workflows" 的 Wayback repair rollback plan。

on:
  schedule:
    - cron: "43 0 * * *"  # UTC 00:43 = 北京 08:43（OpenAlex 配额 UTC 午夜重置后）
  workflow_dispatch:      # 允许手动补跑（write 模式；dry-run 请用 backfill_abstracts.yml 的 wayback-repair job）

concurrency:
  # Shared with backfill_abstracts / collect_papers / update_readme to serialise
  # every workflow that mutates cache.jsonl.gz on Hugging Face.
  group: papervault-cache
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.10"
  AUTO_BACKFILL_BRANCH: "auto-backfill-abstracts"

jobs:
  wayback-repair:
    runs-on: ubuntu-latest
    # 配额正常时全量 ~4.4k 条 × ~1.6s ≈ 2h；加上传/PR 余量给 200 分钟硬上限。
    timeout-minutes: 200
    env:
      TZ: Asia/Shanghai
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PAPERVAULT_HF_REPO_ID: ${{ vars.PAPERVAULT_HF_REPO_ID }}
      # cache.jsonl.gz 走 HF；强制经典 HTTPS/LFS 路径（Xet 在部分网络上会停滞）。
      HF_HUB_DISABLE_XET: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout (no LFS; cache.jsonl.gz lives on Hugging Face)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Repair wayback-wrapped URLs (write mode, HF sync deferred)
        # --no-sync：HF 推送延后到 PR 开好以后，保证"PR（含迁移日志）先行、
        # HF 推送殿后"。被限流的记录保持不变，次日定时 run 自然重试。
        run: |
          python scripts/repair_wayback_urls.py --write --no-sync | tee "$RUNNER_TEMP/wayback_repair.log"
          {
            echo "### Wayback repair report (scheduled write run)"
            echo ""
            echo '```'
            tail -n 60 "$RUNNER_TEMP/wayback_repair.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check whether anything was repaired
        # 报告中的 "rewrite (in place)" + "merge (dup (conf,url))" 计数；
        # 全限流的日子（rewrite=0）不开空 PR、不推 HF。
        id: repaired
        run: |
          rewritten=$(grep -oP 'rewrite \(in place\)\s*:\s*\K[0-9]+' "$RUNNER_TEMP/wayback_repair.log" || echo 0)
          merged=$(grep -oP 'merge \(dup \(conf,url\)\)\s*:\s*\K[0-9]+' "$RUNNER_TEMP/wayback_repair.log" || echo 0)
          rewritten=${rewritten:-0}; merged=${merged:-0}
          echo "rewrite=$rewritten merge=$merged"
          if [ "$rewritten" -gt 0 ] || [ "$merged" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[*] No URLs repaired this run (likely OpenAlex daily quota exhausted); will retry on the next scheduled run."
          fi

      - name: Setup GIT user
        if: steps.repaired.outputs.changed == 'true'
        run: |
          git config --local user.name "youngfish42"
          git config --local user.email "youngfish42@users.noreply.github.com"

      - name: Fetch latest main
        if: steps.repaired.outputs.changed == 'true'
        run: git fetch origin main

      - name: Create Pull Request with migration log
        # 迁移日志（每条 旧→新 URL 映射）是回滚依据，必须随 PR 提交。
        # cache.jsonl.gz / progress 不进 PR（它们在 Hugging Face 上）。
        if: steps.repaired.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(auto): repair wayback-wrapped dead paper URLs"
          committer: youngfish42 <youngfish42@users.noreply.github.com>
          author: youngfish42 <youngfish42@users.noreply.github.com>
          title: "[Auto] Repair wayback-wrapped dead paper URLs"
          body: |
            This PR was automatically generated by the `wayback_repair` workflow
            (scheduled daily run).

            It repairs `web.archive.org`-wrapped dead `paper_url`s via OpenAlex
            title lookup (see `scripts/repair_wayback_urls.py`). The attached
            `cache/wayback_repair_log.jsonl` records every old→new URL mapping
            and is the basis for rollback (see AGENTS.md "CI/CD Workflows").

            The cache itself (`cache/cache.jsonl.gz`) is pushed to Hugging Face
            by the follow-up step, not committed here.

            ---
            *Maintained by [@youngfish42](https://github.com/youngfish42).*
          branch: ${{ env.AUTO_BACKFILL_BRANCH }}
          delete-branch: false
          add-paths: |
            cache/wayback_repair_log.jsonl

      - name: Push updated cache to Hugging Face
        if: steps.repaired.outputs.changed == 'true'
        run: |
          python -c "from data_artifacts import sync_cache_artifacts; sync_cache_artifacts(commit_message='Repair web.archive.org-wrapped dead paper URLs (scheduled)')"

      - name: Upload repair log artifact
        # 无论是否有改写都留 artifact，便于核查限流日与成功日。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayback-repair-log-${{ github.run_number }}
          path: cache/wayback_repair_log.jsonl
          if-no-files-found: ignore
          retention-days: 30

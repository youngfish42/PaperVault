name: Collect Papers

env:
  PYTHON_VERSION: "3.10"
  AUTO_COLLECT_BRANCH: "auto-collect-papers"
  # cache/cache.jsonl.gz is intentionally excluded: it is now stored on
  # Hugging Face (PAPERVAULT_HF_REPO_ID) and pulled via data_artifacts.ensure_cache_local.
  AUTO_COLLECT_FILES: "cache/collect_progress.json cache/collect_failures.json README.md"

on:
  schedule:
    # 每月 15 号 16:00 (UTC) 运行一次，与 backfill_abstracts 错开
    - cron: "0 16 15 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "收集模式: incremental (默认增量) 或 force (全量重建)"
        required: false
        default: "incremental"
  push:
    branches:
      - main
    paths:
      - "conf/**"

concurrency:
  # Shared across collect_papers / backfill_abstracts / update_readme to
  # serialise every workflow that mutates cache.jsonl.gz on Hugging Face.
  # cancel-in-progress is false so already-running jobs finish gracefully
  # (each holds a snapshot of the cache and an in-flight HF push).
  group: papervault-cache
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Shanghai
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PAPERVAULT_HF_REPO_ID: ${{ vars.PAPERVAULT_HF_REPO_ID }}
      # Force the classic HTTPS/LFS download path on the runner; the Xet
      # protocol has been observed to stall on some networks and there is no
      # benefit to it for our single ~250MB cache file.
      HF_HUB_DISABLE_XET: "1"
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout (no LFS; cache.jsonl.gz lives on Hugging Face)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          rm -rf ~/.cache/matplotlib

      - name: Restore in-progress auto collect state
        run: |
          write_hashes() {
            local output_file="$1"
            : > "$output_file"
            for file in ${{ env.AUTO_COLLECT_FILES }}; do
              if [ -f "$file" ]; then
                sha256sum "$file" >> "$output_file"
              else
                printf 'missing  %s\n' "$file" >> "$output_file"
              fi
            done
          }

          if git ls-remote --exit-code --heads origin "${{ env.AUTO_COLLECT_BRANCH }}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${{ env.AUTO_COLLECT_BRANCH }}"
            for file in ${{ env.AUTO_COLLECT_FILES }}; do
              if git cat-file -e "origin/${{ env.AUTO_COLLECT_BRANCH }}:$file" 2>/dev/null; then
                git checkout "origin/${{ env.AUTO_COLLECT_BRANCH }}" -- "$file"
              else
                echo "Skip missing tracked file from ${{ env.AUTO_COLLECT_BRANCH }}: $file"
              fi
            done
            echo "Restored latest auto collect state from ${{ env.AUTO_COLLECT_BRANCH }}."
          else
            echo "No existing auto collect branch found; starting from main."
          fi

          write_hashes "$RUNNER_TEMP/collect_baseline.sha256"

      - name: Snapshot cache.jsonl.gz baseline (from Hugging Face)
        # Pull the authoritative cache from HF and count its records BEFORE
        # any collection runs. We gate PR creation on this count so PRs are
        # only opened when cache.jsonl.gz actually grew (i.e. real new
        # papers were merged in). Record-count is the invariant signal:
        # save_cache always rewrites the gzip (so sha256 alone is noisy),
        # but the line count only grows when new papers are appended.
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip
          import os

          from data_artifacts import ensure_cache_local, DEFAULT_CACHE_PATH

          cache_path, _ = ensure_cache_local(DEFAULT_CACHE_PATH)
          cache_path = Path(cache_path)

          count = 0
          if cache_path.exists():
              with gzip.open(cache_path, "rt", encoding="utf-8") as handle:
                  for line in handle:
                      if line.strip():
                          count += 1

          out = Path(os.environ["RUNNER_TEMP"]) / "cache_baseline.count"
          out.write_text(f"{count}\n", encoding="utf-8")
          print(f"[+] cache baseline record count={count}")
          PY

      - name: Run paper collection
        run: |
          if [ "${{ github.event.inputs.mode }}" == "force" ]; then
            echo "[*] Force mode: full cache rebuild"
            python maintain.py force
          else
            echo "[*] Incremental mode: collecting only missing conferences"
            python maintain.py collect --soft-timeout 18000
          fi

      - name: Check for changes
        id: check_changes
        # Two gates must both hold for a PR to be opened:
        #   1. cache.jsonl.gz gained at least one new record (real new papers),
        #   2. at least one tracked progress/README file changed.
        # The first gate is the important one: it prevents bandwidth-wasting
        # PRs like #77 where progress JSON timestamps moved but zero new
        # papers were added to the authoritative cache on Hugging Face.
        # Force-mode runs (manual workflow_dispatch with mode=force) bypass
        # the cache-count gate because a full rebuild legitimately wants to
        # refresh the README/stats artefacts regardless of net record delta.
        run: |
          : > "$RUNNER_TEMP/collect_current.sha256"
          for file in ${{ env.AUTO_COLLECT_FILES }}; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> "$RUNNER_TEMP/collect_current.sha256"
            else
              printf 'missing  %s\n' "$file" >> "$RUNNER_TEMP/collect_current.sha256"
            fi
          done

          progress_changed=false
          if ! cmp --silent "$RUNNER_TEMP/collect_baseline.sha256" "$RUNNER_TEMP/collect_current.sha256"; then
            progress_changed=true
          fi

          python - <<'PY'
          from pathlib import Path
          import gzip
          import os

          cache_path = Path("cache/cache.jsonl.gz")
          count = 0
          if cache_path.exists():
              with gzip.open(cache_path, "rt", encoding="utf-8") as handle:
                  for line in handle:
                      if line.strip():
                          count += 1

          out = Path(os.environ["RUNNER_TEMP"]) / "cache_current.count"
          out.write_text(f"{count}\n", encoding="utf-8")
          print(f"[+] cache current record count={count}")
          PY

          baseline_count=$(cat "$RUNNER_TEMP/cache_baseline.count" | tr -d '[:space:]')
          current_count=$(cat "$RUNNER_TEMP/cache_current.count" | tr -d '[:space:]')
          echo "baseline_count=$baseline_count current_count=$current_count"

          cache_changed=false
          if [ "$current_count" -gt "$baseline_count" ]; then
            cache_changed=true
          fi

          force_mode=false
          if [ "${{ github.event.inputs.mode }}" = "force" ]; then
            force_mode=true
          fi

          echo "progress_changed=$progress_changed cache_changed=$cache_changed force_mode=$force_mode"

          if [ "$progress_changed" = "true" ] && { [ "$cache_changed" = "true" ] || [ "$force_mode" = "true" ]; }; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [ "$cache_changed" != "true" ] && [ "$force_mode" != "true" ]; then
              echo "[*] cache.jsonl.gz gained no new records; skipping PR creation to save bandwidth."
            fi
          fi

      - name: Setup GIT user
        run: |
          git config --local user.name "youngfish42"
          git config --local user.email "youngfish42@users.noreply.github.com"

      - name: Fetch latest main
        run: git fetch origin main

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(auto): collect papers for new conferences"
          committer: youngfish42 <youngfish42@users.noreply.github.com>
          author: youngfish42 <youngfish42@users.noreply.github.com>
          title: "[Auto] Collect papers for new conferences"
          body: |
            This PR was automatically generated by the `collect_papers` workflow.

            It incrementally collects paper metadata for newly discovered conferences
            and updates the README conference list,
            continuing from the latest in-progress auto-collect branch state.
            Please review the changes before merging.

            ---
            *Maintained by [@youngfish42](https://github.com/youngfish42).*
            *For questions, please contact: im.young@foxmail.com*
          branch: ${{ env.AUTO_COLLECT_BRANCH }}
          delete-branch: false
          # Defensive whitelist: never let cache/cache.jsonl.gz sneak into the PR.
          # The authoritative copy lives on Hugging Face (PAPERVAULT_HF_REPO_ID)
          # and is uploaded by data_artifacts.sync_cache_artifacts; only the
          # collection progress + rendered README should be committed back to git.
          add-paths: |
            cache/collect_progress.json
            cache/collect_failures.json
            README.md

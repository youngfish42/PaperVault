name: Backfill Abstracts

env:
  PYTHON_VERSION: "3.10"
  AUTO_BACKFILL_BRANCH: "auto-backfill-abstracts"
  # cache/cache.jsonl.gz is intentionally excluded: it lives on Hugging Face
  # (PAPERVAULT_HF_REPO_ID) and is synced via data_artifacts.ensure_cache_local.
  AUTO_BACKFILL_FILES: "cache/abstract_backfill_progress.json docs/abstract_backfill_progress.md pics/stats/stats_overview.svg"

on:
  schedule:
    # 每月 1 号 00:00 (UTC) 运行一次，运行时长由 --soft-timeout 控制（约5小时后自动保存进度退出）
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      target_conf:
        description: "手动指定 conf（如 AAAI2020），留空则自动处理最高优先级论文，直到时间耗尽"
        required: false
        default: ""

concurrency:
  # Shared with collect_papers / update_readme to serialise every workflow
  # that mutates cache.jsonl.gz on Hugging Face.
  group: papervault-cache
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Shanghai
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PAPERVAULT_HF_REPO_ID: ${{ vars.PAPERVAULT_HF_REPO_ID }}
      # Force the classic HTTPS/LFS download path on the runner; the Xet
      # protocol has been observed to stall on some networks and there is no
      # benefit to it for our single ~250MB cache file.
      HF_HUB_DISABLE_XET: "1"
      # cache/cache.jsonl.gz is no longer maintained via Git LFS (it now lives
      # on Hugging Face). However, cache/abstract_backfill_progress.json is
      # still tracked by LFS in .gitattributes, and the in-progress restore
      # step below performs `git checkout origin/<branch> -- <file>` against
      # exactly that file. Without this flag the LFS smudge filter would run
      # and fail once the repository's LFS bandwidth budget is exhausted.
      # Setting it at job scope also covers peter-evans/create-pull-request's
      # internal `git checkout`.
      GIT_LFS_SKIP_SMUDGE: "1"
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout (no LFS; cache.jsonl.gz lives on Hugging Face)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore in-progress auto backfill state
        run: |
          write_hashes() {
            local output_file="$1"
            : > "$output_file"
            for file in ${{ env.AUTO_BACKFILL_FILES }}; do
              if [ -f "$file" ]; then
                sha256sum "$file" >> "$output_file"
              else
                printf 'missing  %s\n' "$file" >> "$output_file"
              fi
            done
          }

          if git ls-remote --exit-code --heads origin "${{ env.AUTO_BACKFILL_BRANCH }}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${{ env.AUTO_BACKFILL_BRANCH }}"
            for file in ${{ env.AUTO_BACKFILL_FILES }}; do
              if git cat-file -e "origin/${{ env.AUTO_BACKFILL_BRANCH }}:$file" 2>/dev/null; then
                git checkout "origin/${{ env.AUTO_BACKFILL_BRANCH }}" -- "$file"
              else
                echo "Skip missing tracked file from ${{ env.AUTO_BACKFILL_BRANCH }}: $file"
              fi
            done
            echo "Restored latest auto backfill state from ${{ env.AUTO_BACKFILL_BRANCH }}."
          else
            echo "No existing auto backfill branch found; starting from main."
          fi

          write_hashes "$RUNNER_TEMP/backfill_baseline.sha256"

      - name: Snapshot cache.jsonl.gz abstract baseline (from Hugging Face)
        # Pull the authoritative cache from HF and count how many records
        # currently have a non-empty paper_abstract BEFORE the backfill runs.
        # We gate PR creation on this number growing, so a no-op backfill
        # (every targeted paper failed lookup, or all targets were already
        # covered) does not open a bandwidth-wasting PR just because
        # progress JSON timestamps moved.
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip
          import json
          import os

          from data_artifacts import ensure_cache_local, DEFAULT_CACHE_PATH

          cache_path, _ = ensure_cache_local(DEFAULT_CACHE_PATH)
          cache_path = Path(cache_path)

          total = 0
          with_abstract = 0
          if cache_path.exists():
              with gzip.open(cache_path, "rt", encoding="utf-8") as handle:
                  for line in handle:
                      line = line.strip()
                      if not line:
                          continue
                      total += 1
                      try:
                          record = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if (record.get("paper_abstract") or "").strip():
                          with_abstract += 1

          out = Path(os.environ["RUNNER_TEMP"]) / "cache_baseline.count"
          out.write_text(f"{with_abstract} {total}\n", encoding="utf-8")
          print(f"[+] cache baseline abstracts={with_abstract}/{total}")
          PY

      - name: Run abstract backfill
        run: |
          if [ -n "${{ github.event.inputs.target_conf }}" ]; then
            python scripts/fetch_abstracts.py --conf "${{ github.event.inputs.target_conf }}" --chunk-size 500 --soft-timeout 18000 --max-failed-attempts 3
          else
            python scripts/fetch_abstracts.py --batch --chunk-size 500 --soft-timeout 18000 --max-failed-attempts 3
          fi

      - name: Scan GitHub code links from newly backfilled abstracts
        # Pure regex pass over all abstracts; cheap I/O-bound step that keeps the
        # `paper_code` field in sync whenever new abstracts are introduced.
        run: python scripts/fetch_code_links.py --year all --retry-failed

      - name: Regenerate stats overview chart
        run: |
          mkdir -p pics/stats

          python - <<'PY'
          from maintain import cache_path, load_cache, compute_stats, generate_overview_svg
          import os

          if not os.path.exists(cache_path):
              raise SystemExit(f"Cache file not found: {cache_path}")

          cache_data = load_cache(cache_path)
          stats = compute_stats(cache_data)
          generate_overview_svg(stats)
          print("Regenerated stats_overview.svg from latest cache.")
          PY

      - name: Check for changes
        id: check_changes
        # Two gates must both hold for a PR to be opened:
        #   1. The number of records carrying a non-empty paper_abstract grew
        #      (i.e. the backfill actually merged in at least one new abstract),
        #   2. At least one tracked progress/stats file changed.
        # Gate (1) prevents the bandwidth-wasting "ghost PR" pattern where
        # only timestamps inside cache/abstract_backfill_progress.json moved
        # while no new abstract content was added to the authoritative
        # cache.jsonl.gz on Hugging Face.
        run: |
          : > "$RUNNER_TEMP/backfill_current.sha256"
          for file in ${{ env.AUTO_BACKFILL_FILES }}; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> "$RUNNER_TEMP/backfill_current.sha256"
            else
              printf 'missing  %s\n' "$file" >> "$RUNNER_TEMP/backfill_current.sha256"
            fi
          done

          progress_changed=false
          if ! cmp --silent "$RUNNER_TEMP/backfill_baseline.sha256" "$RUNNER_TEMP/backfill_current.sha256"; then
            progress_changed=true
          fi

          python - <<'PY'
          from pathlib import Path
          import gzip
          import json
          import os

          cache_path = Path("cache/cache.jsonl.gz")
          total = 0
          with_abstract = 0
          if cache_path.exists():
              with gzip.open(cache_path, "rt", encoding="utf-8") as handle:
                  for line in handle:
                      line = line.strip()
                      if not line:
                          continue
                      total += 1
                      try:
                          record = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if (record.get("paper_abstract") or "").strip():
                          with_abstract += 1

          out = Path(os.environ["RUNNER_TEMP"]) / "cache_current.count"
          out.write_text(f"{with_abstract} {total}\n", encoding="utf-8")
          print(f"[+] cache current abstracts={with_abstract}/{total}")
          PY

          baseline_abs=$(awk '{print $1}' "$RUNNER_TEMP/cache_baseline.count")
          current_abs=$(awk '{print $1}' "$RUNNER_TEMP/cache_current.count")
          # Defensive defaults: if either snapshot file was unreadable
          # (HF outage, disk full, etc.) treat the count as 0 so the
          # bash arithmetic test below cannot blow up with "unary
          # operator expected" and abort the workflow before we have a
          # chance to print a useful skip message.
          baseline_abs=${baseline_abs:-0}
          current_abs=${current_abs:-0}
          echo "baseline_abstracts=$baseline_abs current_abstracts=$current_abs"

          cache_changed=false
          if [ "$current_abs" -gt "$baseline_abs" ]; then
            cache_changed=true
          fi

          # Manual workflow_dispatch bypass (symmetric with collect_papers.yml).
          # When an operator triggers the workflow by hand -- especially with a
          # specific --conf target -- they usually want the resulting progress
          # bookkeeping (failed_attempts increments, abstract_backfill_progress.md,
          # regenerated stats SVG) to be pushed even if zero new abstracts were
          # actually merged in (e.g. every targeted paper failed lookup on all
          # four sources). Without this bypass those manual runs would never
          # produce a PR and the bookkeeping would be lost on the next cron.
          force_mode=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            force_mode=true
          fi

          echo "progress_changed=$progress_changed cache_changed=$cache_changed force_mode=$force_mode"

          if [ "$progress_changed" = "true" ] && { [ "$cache_changed" = "true" ] || [ "$force_mode" = "true" ]; }; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [ "$cache_changed" != "true" ] && [ "$force_mode" != "true" ]; then
              echo "[*] cache.jsonl.gz gained no new abstracts; skipping PR creation to save bandwidth."
            fi
          fi

      - name: Setup GIT user
        run: |
          git config --local user.name "youngfish42"
          git config --local user.email "youngfish42@users.noreply.github.com"

      - name: Fetch latest main
        run: git fetch origin main

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(auto): backfill abstracts"
          committer: youngfish42 <youngfish42@users.noreply.github.com>
          author: youngfish42 <youngfish42@users.noreply.github.com>
          title: "[Auto] Backfill paper abstracts"
          body: |
            This PR was automatically generated by the `backfill_abstracts` workflow.

            It backfills abstracts for pending papers across conferences/journals,
            continuing from the latest in-progress auto-backfill branch state.
            The `pics/stats/stats_overview.svg` chart is regenerated from the
            updated cache so the README statistics overview stays in sync.
            Please review the changes before merging.

            ---
            *Maintained by [@youngfish42](https://github.com/youngfish42).*
            *For questions, please contact: im.young@foxmail.com*
          branch: ${{ env.AUTO_BACKFILL_BRANCH }}
          delete-branch: false
          add-paths: |
            cache/abstract_backfill_progress.json
            docs/abstract_backfill_progress.md
            pics/stats/stats_overview.svg

      - name: Sync Hugging Face dataset README
        # Render docs/HF_README.md with the just-updated cache stats and push
        # it to the HF dataset repo root as README.md. Runs unconditionally so
        # the HF landing page reflects the latest abstract coverage even when
        # no PR is opened back to GitHub.
        if: always()
        run: python scripts/sync_hf_readme.py --skip-cache-refresh
